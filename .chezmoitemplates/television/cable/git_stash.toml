[metadata]
name = "git-stash"
description = "List stashes in git repository"
requirements = ["git"]

[source]
command = "git stash list --format='%gd:%s (%cr): '"

[preview]
command = [
    "git stash show --stat --color=always {split::0}",
    "git stash show -p --color=always {split::0}"
]

[keybindings]
"enter" = "actions:view_full_diff"

[actions.view_full_diff]
command = "git stash show -p --color=always {split::0} | less -R"
mode = "fork"